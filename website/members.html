<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf8">
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <title>Members' area – MOCGB</title>
  <meta name="robots" content="noindex">
  <!-- Link previews (WhatsApp, iMessage, Facebook, Slack): read by crawlers that don't run JavaScript,
       so the picture is a real file at an absolute URL. share.jpg is made by `npm run share:image`.
       It names the production host; the dev Preview's cards use the same picture. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MOCGB">
  <meta property="og:title" content="Members' area – MOCGB">
  <meta property="og:description" content="The members' area of the Mustang Owners Club of Great Britain.">
  <meta property="og:image" content="https://mocgb.helloshep.com/share.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Three red tail-light bars above the title Mustang Owners Club of Great Britain, on navy racing stripes">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="MOCGB">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/" aria-label="MOCGB home">
        <span class="lights" aria-hidden="true"><span></span><span></span><span></span></span>
        MOCGB
      </a>
      <a class="header-button header-button--quiet" href="/">Home</a>
    </div>
  </header>

  <main class="page">
    <div class="wrap">
      <h1 class="display">Members' area</h1>
      <!-- Login form goes here once the backend is in place -->
      <p>Member login isn't open yet. Once it is, you'll sign in here to see club news, documents and listings.</p>
      <div class="actions">
        <a class="button button--quiet" href="/">Back to the home page</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Mustang Owners Club of Great Britain</p>
      <p>Not affiliated with Ford Motor Company.</p>
      <div class="theme-switch" role="group" aria-label="Colour theme">
        <button type="button" data-theme-choice="system" aria-pressed="true">System</button>
        <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </footer>
  <script src="theme.js" defer></script>
  <script src="pwa.js" defer></script>
</body>
</html>
