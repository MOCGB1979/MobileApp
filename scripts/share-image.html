<!doctype html>
<!-- Template for website/share.jpg, the 1200x630 picture shown in WhatsApp/iMessage/Facebook link previews.
     Rendered by scripts/share-image.sh (npm run share:image). -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #1b2a4e; color: #fff;
    font-family: "Archivo", sans-serif;
    display: grid; place-content: center; justify-items: center; text-align: center;
  }
  /* Le Mans stripes, tone on tone so the title stays legible */
  body::before, body::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 210px; background: #22355f;
  }
  body::before { left: calc(50% - 225px); }
  body::after  { left: calc(50% + 15px); }
  .lights, h1, p { position: relative; z-index: 1; }
  .lights { display: flex; gap: 10px; height: 92px; margin-bottom: 34px; }
  .lights span { width: 30px; background: #d01c25; border-radius: 3px; box-shadow: 0 0 28px rgba(255, 42, 47, .45); }
  h1 {
    margin: 0; font-size: 104px; line-height: .95; font-weight: 800;
    font-variation-settings: "wdth" 62; letter-spacing: -.01em;
  }
  p { margin: 30px 0 0; font-size: 34px; color: #c5cbd8; }
</style>
</head>
<body>
  <div class="lights"><span></span><span></span><span></span></div>
  <h1>Mustang Owners Club<br>of Great Britain</h1>
  <p>Events, area meetings and club contacts</p>
</body>
</html>
